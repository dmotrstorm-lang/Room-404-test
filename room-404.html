<html lang="en"><head><meta charset="utf-8">

<style>:root{--bg:#111113;--surf:#252326;--wall:#514A48;--warm:#A18C78;--text:#B8B0A2;--term:#A0B59B}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Courier New",ui-monospace,monospace;

.btn{font:inherit;color:var(--text);background:transparent;border:1px solid var(--wall);padding:.85em 1.4em;min-height:44px;cursor:pointer;

</style><style>#menu{align-items:center;justify-content:center;overflow:hidden}

</style><style>#fx-grain{position:fixed;inset:-50%;pointer-events:none;z-index:90;opacity:.11;mix-blend-mode:overlay;

 animation:grain .9s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-4%,3%)}40%{transform:translate(3%,-5%)}60%{transform:translate(-5%,-2%)}80%{transform:translate(4%,4%)}100%{transform:translate(0,0)}}

<script>window.R404 = window.R404 || {};
(function () {
  const K = 'room404.save.v1', SK = 'room404.settings.v1';
  const S = {
    default() { return { scene: 'entrance', flags: {}, items: [], read: [], ending: null }; },
    has() { return !!S.load(); },
    load() {
      try {
        const d = JSON.parse(localStorage.getItem(K));
        if (d && typeof d.scene === 'string' && d.flags && Array.isArray(d.items)) return Object.assign(S.default(), d);
      } catch (e) {}
      return null;
    },
    save(st) { try { localStorage.setItem(K, JSON.stringify(st)); } catch (e) {} },
    reset() { try { localStorage.removeItem(K); } catch (e) {} },
    settings() {
      try { const s = JSON.parse(localStorage.getItem(SK)); if (s) return Object.assign({ vol: 0.5, muted: false }, s); } catch (e) {}
      return { vol: 0.5, muted: false };
    },
    saveSettings(s) { try { localStorage.setItem(SK, JSON.stringify(s)); } catch (e) {} }
  };
  R404.save = S;
})();
</script><script>(function () {
  // Optional real files: R404.audio.files.click = 'assets/audio/effects/click.mp3'
  const A = {
    ctx: null, master: null, files: {}, set: R404.save.settings(),
    init() {
      if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      this.ctx = new C(); this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
      this.apply(); this.hum();
    },
    apply() { if (this.master) this.master.gain.value = this.set.muted ? 0 : this.set.vol; R404.save.saveSettings(this.set); },
    hum() {
      const c = this.ctx, g = c.createGain(); g.gain.value = 0.07;
      const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 160;
      [48, 50.2, 96.5].forEach((fr, i) => { const o = c.createOscillator(); o.frequency.value = fr; o.type = i === 2 ? 'triangle' : 'sine'; o.connect(f); o.start(); });
      const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 0.07; lg.gain.value = 0.03; lfo.connect(lg); lg.connect(g.gain); lfo.start();
      f.connect(g); g.connect(this.master);
    },
    tone(fr, d, type, vol, to) {
      const c = this.ctx, o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
      o.type = type || 'sine'; o.frequency.setValueAtTime(fr, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
      g.gain.setValueAtTime(vol || 0.1, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d);
    },
    noise(d, cut, vol) {
      const c = this.ctx, n = c.sampleRate * d, b = c.createBuffer(1, n, c.sampleRate), data = b.getChannelData(0);
      for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      f.type = 'lowpass'; f.frequency.value = cut; g.gain.value = vol; s.buffer = b; s.connect(f); f.connect(g); g.connect(this.master); s.start();
    },
    play(name) {
      if (!this.ctx || this.set.muted) return;
      if (this.files[name]) { try { const a = new Audio(this.files[name]); a.volume = this.set.vol; a.play(); return; } catch (e) {} }
      switch (name) {
        case 'click': this.tone(900, 0.04, 'square', 0.04); break;
        case 'door': this.noise(0.5, 400, 0.5); this.tone(70, 0.4, 'sine', 0.2, 40); break;
        case 'pickup': this.tone(520, 0.12, 'triangle', 0.1); setTimeout(() => this.tone(780, 0.2, 'triangle', 0.1), 110); break;
        case 'shift': this.tone(220, 1.2, 'sawtooth', 0.06, 40); this.noise(0.9, 900, 0.25); break;
        case 'note': this.tone(330, 0.8, 'sine', 0.07); this.tone(392, 1, 'sine', 0.05); break;
        case 'deny': this.tone(140, 0.15, 'square', 0.06); break;
        case 'boot': this.noise(0.6, 2000, 0.15); this.tone(60, 0.6, 'sine', 0.1); break;
      }
    }
  };
  R404.audio = A;
})();
</script>
<script>(function () {
  const box = () => document.getElementById('dialogue'), txt = () => document.getElementById('dlg-text');
  const D = { q: [], i: 0, timer: null, typing: false, done: null,
    say(lines, done) {
      this.q = Array.isArray(lines) ? lines.slice() : [lines]; this.i = 0; this.done = done || null; this.show();
    },
    show() {
      const line = this.q[this.i], el = txt(); clearInterval(this.timer); el.textContent = ''; this.typing = true;
      let n = 0; box().classList.remove('more');
      this.timer = setInterval(() => { el.textContent = line.slice(0, ++n); if (n >= line.length) this.finish(); }, 16);
    },
    finish() {
      clearInterval(this.timer); this.typing = false; txt().textContent = this.q[this.i];
      box().classList.toggle('more', this.i < this.q.length - 1 || !!this.done);
    },
    advance() {
      if (!this.q.length) return;
      if (this.typing) return this.finish();
      if (this.i < this.q.length - 1) { this.i++; this.show(); }
      else if (this.done) { const d = this.done; this.done = null; box().classList.remove('more'); d(); }
    },
    clear() { clearInterval(this.timer); this.q = []; this.done = null; txt().textContent = ''; box().classList.remove('more'); }
  };
  R404.dialogue = D;
})();
</script><script>(function () {
  const ITEMS = {
    KEY: 'A small brass key. The teeth are worn flat, as if used every day.',
    PHOTOGRAPH: 'A photograph of two people. One of them has no face.',
    CASSETTE: 'A cassette with no label. Something hisses inside it.',
    'ARCHIVE CARD': 'A plastic card stamped ARCHIVE. A single line reads: ROOM_404.'
  };
  const Inv = {
    items: ITEMS, selected: null,
    has(id) { return R404.game.state.items.includes(id); },
    add(id) { const s = R404.game.state; if (!s.items.includes(id)) { s.items.push(id); R404.game.persist(); } this.render(); },
    select(id) {
      this.selected = (this.selected === id) ? null : id;
      document.body.classList.toggle('has-sel', !!this.selected);
      this.render();
      if (this.selected) R404.dialogue.say(this.selected + ': ' + ITEMS[this.selected] + ' (Tap an object to use it.)');
    },
    render() {
      const el = document.getElementById('inventory'), list = R404.game.state ? R404.game.state.items : [];
      el.innerHTML = '';
      if (!list.length) { el.innerHTML = '<span class="inv-empty">NO ITEMS</span>'; return; }
      list.forEach(id => {
        const b = document.createElement('button');
        b.className = 'btn slot' + (id === this.selected ? ' sel' : ''); b.textContent = id;
        b.onclick = () => { R404.audio.play('click'); this.select(id); };
        el.appendChild(b);
      });
    }
  };
  R404.inventory = Inv;
})();
</script>

<rect x="10" y="14" width="22" height="40" rx="2" fill="#1b1b1e" stroke="#A18C78" stroke-width="1"/>

<rect x="108" y="8" width="36" height="62" fill="#3a3230" stroke="#111113" stroke-width="1"/>

    },

        G.say(G.has('shifted') ? 'The mirror shows this room, but empty and brightly lit. You are not in it.' : 'Your reflection is half a second late. It waits for you to finish blinking.'); } },
      { id: 'clock', label: 'CLOCK', x: 44, y: 10, w: 16, h: 16, on(G) {
        G.say(G.has('shifted') ? 'The hands have jumped to 4:04. The ticking has stopped, but you can still hear it.' : 'The clock reads 3:17. Every time you look away, it still reads 3:17.'); } },
      { id: 'photo', label: 'PHOTOGRAPH', x: 70, y: 14, w: 16, h: 20, on(G) {
        G.say(G.has('shifted') ? 'The faceless figure is gone. The other one now looks straight at you, and its face is yours.' : 'Two people stand side by side. One smiles. The other has no face at all, only smooth skin.'); } },
      { id: 'wardrobe', label: 'WARDROBE', x: 108, y: 8, w: 36, h: 62, on(G) {
        if (!G.has('wardrobeOpen')) {
          G.flag('wardrobeOpen'); G.audio('door'); G.refresh();
          G.say('The wardrobe opens without a sound. Empty hangers sway. A KEY lies on the floor.', () => { G.give('KEY'); G.say('You take the KEY.'); G.checkShift(); });
        } else G.say('Empty hangers. They sway although the air is still.'); } },
      { id: 'lamp', label: 'DESK LAMP', x: 12, y: 42, w: 16, h: 16, on(G) {
        const on = !G.has('lamp'); G.flag('lamp', on); G.audio('click'); G.refresh();
        G.say(on ? 'The lamp comes on. "If the light is on, someone has already been here."' : 'You switch the lamp off. The room is darker than it was before.');
        if (on) G.checkShift(); } },
      { id: 'computer', label: 'COMPUTER', x: 50, y: 38, w: 24, h: 18, on(G) {
        G.audio('boot'); G.flag('sawComputer'); G.say(['The screen reads: WELCOME BACK, USER 404.', 'The keyboard does not respond yet. Something is still missing.']); } },
      { id: 'drawer', label: 'DRAWER', x: 56, y: 62, w: 18, h: 6, on(G) {
        G.audio('deny'); G.say(G.has('drawerOpen') ? 'The drawer is empty now.' : 'The drawer is locked. The keyhole is small and brass.'); },
        use: { KEY(G) {
          if (G.has('drawerOpen')) return G.say('The drawer is already open and empty.');
          G.flag('drawerOpen'); G.audio('pickup'); G.give('ARCHIVE CARD'); G.say('The key fits. Inside is an ARCHIVE CARD. You take it.'); } } },
      { id: 'exit', label: 'FRONT DOOR', x: 146, y: 20, w: 12, h: 50, on(G) { G.audio('door'); G.go('entrance'); } }
    ]
  };
  R404.scenes = { entrance, apartment };
})();
</script><script>(function () {
  R404.interact = {
    click(hs) {
      const A = R404.audio, G = R404.game, Inv = R404.inventory, sel = Inv.selected;
      A.play('click');
      if (sel) {
        if (hs.use && hs.use[sel]) { Inv.selected = null; document.body.classList.remove('has-sel'); Inv.render(); hs.use[sel](G); }
        else { A.play('deny'); G.say('The ' + sel + ' has no use on the ' + hs.label + '.'); }
        return;
      }
      hs.on(G);
    }
  };
})();
</script>
<script>// Stage 5: endings are defined here. Not wired yet — see README roadmap.
R404.endings = {
  deleted:  { title: 'DELETED',  text: ['Record successfully deleted.'] },
  restored: { title: 'RESTORED', text: ['Session successfully restored.'] },
  unknown:  { title: 'UNKNOWN',  text: ['Are you sure you were ever here?', 'USER NOT FOUND.'] }
};
</script><script>(function () {
  const $ = id => document.getElementById(id);
  const G = {
    state: null,
    start(fresh) {
      this.state = fresh ? R404.save.default() : (R404.save.load() || R404.save.default());
      if (!R404.scenes[this.state.scene]) this.state.scene = 'entrance';
      R404.inventory.selected = null; document.body.classList.remove('has-sel');
      R404.showScreen('game'); R404.dialogue.clear(); R404.inventory.render();
      this.go(this.state.scene, true);
      if (fresh) R404.dialogue.say('A notification brought you here: collect your belongings from apartment 404. Tap the door.');
    },
    persist() { R404.save.save(this.state); },
    has(k) { return !!this.state.flags[k]; },
    flag(k, v = true) { this.state.flags[k] = v; this.persist(); },
    give(id) { R404.inventory.add(id); R404.audio.play('pickup'); },
    audio(n) { R404.audio.play(n); },
    say(t, done) { R404.dialogue.say(t, done); },
    go(id, instant) {
      const stage = $('stage'), apply = () => { this.state.scene = id; this.persist(); this.refresh(); stage.classList.remove('fading'); };
      if (instant) return apply();
      stage.classList.add('fading'); setTimeout(apply, 600);
    },
    refresh() {
      const sc = R404.scenes[this.state.scene];
      $('scene-art').innerHTML = sc.draw(this);
      $('scene-title').textContent = sc.title;
      const hs = $('hotspots'); hs.innerHTML = '';
      sc.hotspots.forEach(h => {
        const d = document.createElement('div');
        d.className = 'hs'; d.tabIndex = 0; d.setAttribute('role', 'button'); d.setAttribute('aria-label', h.label);
        d.style.cssText = `left:${h.x / 1.6}%;top:${h.y / 0.9}%;width:${h.w / 1.6}%;height:${h.h / 0.9}%`;
        d.onclick = () => R404.interact.click(h);
        d.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); R404.interact.click(h); } };
        d.onmouseenter = d.onfocus = () => { const l = $('hover-label'); l.textContent = h.label; l.classList.add('on'); };
        d.onmouseleave = d.onblur = () => $('hover-label').classList.remove('on');
        hs.appendChild(d);
      });
    },
    checkShift() {
      if (this.has('shifted') || !this.has('lamp') || !R404.inventory.has('KEY')) return;
      this.flag('shifted'); this.audio('shift');
      const st = $('stage'); st.classList.remove('glitch'); void st.offsetWidth; st.classList.add('glitch');
      setTimeout(() => { this.refresh(); this.say('The room shifts. Something in it has changed.'); }, 450);
    }
  };
  R404.game = G;
})();
</script><script>(function () {
  const $ = id => document.getElementById(id), A = R404.audio, S = R404.save;
  R404.showScreen = id => document.querySelectorAll('.screen').forEach(e => e.classList.toggle('active', e.id === id));
  const modal = (html, bind) => { $('panel').innerHTML = html; $('modal').hidden = false; bind && bind($('panel')); };
  const close = () => { $('modal').hidden = true; };
  const confirmBox = (text, yes) => modal(`<p>${text}</p><div class="row"><button class="btn" id="y">YES</button><button class="btn" id="n">CANCEL</button></div>`,
    p => { p.querySelector('#y').onclick = () => { close(); yes(); }; p.querySelector('#n').onclick = close; });
  const refreshMenu = () => { $('b-cont').disabled = !S.has(); };
  const unlock = () => A.init();
  ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, unlock, { once: true }));
  document.addEventListener('click', e => { if (e.target.closest('.btn')) A.play('click'); });

  $('menu-bg').innerHTML = R404.scenes.apartment.draw({ has: k => k === 'lamp' }, 'm');
  $('b-new').onclick = () => S.has() ? confirmBox('A saved session exists. Start a new one and overwrite it?', () => { S.reset(); R404.game.start(true); }) : R404.game.start(true);
  $('b-cont').onclick = () => R404.game.start(false);
  $('b-set').onclick = () => modal(`<h2>SETTINGS</h2><label>Volume<input type="range" id="vol" min="0" max="1" step="0.05" value="${A.set.vol}"></label>
    <div class="row"><label><input type="checkbox" id="mute" ${A.set.muted ? 'checked' : ''}> Mute</label></div>
    <div class="row"><button class="btn" id="rst">RESET PROGRESS</button><button class="btn" id="x">CLOSE</button></div>`, p => {
    p.querySelector('#vol').oninput = e => { A.set.vol = +e.target.value; A.apply(); };
    p.querySelector('#mute').onchange = e => { A.set.muted = e.target.checked; A.apply(); };
    p.querySelector('#rst').onclick = () => confirmBox('Delete all saved progress?', () => { S.reset(); refreshMenu(); });
    p.querySelector('#x').onclick = close;
  });
  $('b-cred').onclick = () => modal('<h2>CREDITS</h2><p>ROOM 404 — prototype.<br>Design, code and placeholder art: generated. All visuals are SVG placeholders; audio is synthesized (Web Audio).</p><div class="row"><button class="btn" id="x">CLOSE</button></div>', p => p.querySelector('#x').onclick = close);
  $('b-back').onclick = () => { R404.dialogue.clear(); R404.showScreen('menu'); refreshMenu(); };
  $('dialogue').onclick = () => R404.dialogue.advance();
  refreshMenu();
})();
</script>
